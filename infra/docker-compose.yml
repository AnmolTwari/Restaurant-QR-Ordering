name: restaurant-saas

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_saas_db}
    ports:
      # Port mapped to 5432 by default, can be overridden via POSTGRES_PORT if host 5432 is occupied
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_admin} -d ${POSTGRES_DB:-restaurant_saas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
